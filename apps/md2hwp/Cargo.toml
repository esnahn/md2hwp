[package]
name = "md2hwp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
md2hwp-core = { path = "../../crates/md2hwp-core" }
md2hwp-svg = { path = "../../crates/md2hwp-svg" }
serde_json = "1.0.140"
# 3.5.0 fixed native-tls-no-default leaving out the NativeTls connector (3.4.x panicked).
ureq = { version = "3.5.1", default-features = false, features = ["native-tls-no-default"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.10"
tempfile = "3"
