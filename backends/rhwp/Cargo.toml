[package]
name = "md2hwp-rhwp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
md2hwp-core = { path = "../../crates/md2hwp-core" }
md2hwp-font-measurement = { path = "../../crates/md2hwp-font-measurement" }
unicode-segmentation = "1.13.3"
rhwp = { git = "https://github.com/edwardkim/rhwp", rev = "e4f8ff2d637d5b0a313211455ae3ccc53444d969", default-features = false }
serde_json = "1.0.140"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
tempfile = "3"

[dev-dependencies]
md2hwp-math = { path = "../../crates/md2hwp-math" }
