[workspace]
members = [
    "apps/md2hwp",
    "backends/rhwp",
    "crates/md2hwp-core",
    "crates/md2hwp-font-measurement",
]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"

# Preserve rhwp's deterministic PDF fixes; Cargo only applies root patches.
[patch.crates-io]
svg2pdf = { path = "dependencies/vendor/svg2pdf" }
