<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200">
  <!-- Features EMF cannot hold here: gradients, a mask, a filter and opacity over
       differently coloured shapes. With the auto target md2hwp stores this drawing as PNG. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6f9f"/>
      <stop offset="1" stop-color="#d9e6f2"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset="0.6" stop-color="#e8a33d"/>
      <stop offset="1" stop-color="#e8a33d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <mask id="wipe">
      <rect x="250" y="110" width="210" height="70" fill="url(#fade)"/>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="4" dy="6" stdDeviation="4" flood-color="#17384f" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="480" height="200" fill="url(#sky)"/>
  <circle cx="110" cy="80" r="70" fill="url(#sun)"/>
  <rect x="250" y="30" width="210" height="60" rx="10" fill="#5a8f3c" filter="url(#shadow)"/>
  <rect x="250" y="110" width="210" height="70" fill="#b03a2e" mask="url(#wipe)"/>
  <g opacity="0.6">
    <rect x="30" y="140" width="90" height="40" fill="#7b4fa3"/>
    <circle cx="130" cy="160" r="26" fill="#17384f"/>
  </g>
</svg>